---
layout: default
---
<article class="journal-entry">
  <header>
    <p class="eyebrow">Daily journal</p>
    <h1>{{ page.title | escape }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>
  <div class="entry-content">{{ content }}</div>
</article>
